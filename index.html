<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tolong maafin aku yah? 🥺</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffe6e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 85%;
      z-index: 10;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    /* Element yang tersembunyi secara default */
    .hidden {
      display: none !important;
    }

    /* Overlay Pembuka */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 230, 233, 0.98);
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #startBtn {
      background-color: #ff4d6d;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .bloom-anim {
      animation: flowerBloom 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes flowerBloom {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
      }
      70% {
        transform: scale(1.05) rotate(2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    img {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 20px;
      margin-bottom: 8px;
    }

    p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      width: 45%;
      transition: transform 0.2s ease;
    }

    #yesBtn:hover {
      background-color: #ff758f;
      transform: scale(1.05);
    }

    #noBtn {
      background-color: #ccc;
      color: #333;
      width: 45%;
      position: relative;
      z-index: 99999;
      transition: transform 0.15s ease, left 0.15s ease, top 0.15s ease;
    }

    .see-btn {
      display: inline-block;
      background-color: #7209b7;
      color: white;
      width: 100%;
      margin-top: 10px;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 25px;
      font-weight: bold;
      font-size: 15px;
      box-sizing: border-box;
    }

    .option-btn {
      background-color: #ff758f;
      color: white;
      width: 100%;
      margin-bottom: 10px;
      padding: 12px 15px;
      border-radius: 20px;
      font-size: 13px;
      text-align: left;
      line-height: 1.4;
      transition: background-color 0.2s ease;
    }

    .option-btn:hover {
      background-color: #ff4d6d;
    }

    .flower {
      position: absolute;
      top: -50px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="startOverlay">
    <button id="startBtn" onclick="mulaiWeb()">Buka Pesan
